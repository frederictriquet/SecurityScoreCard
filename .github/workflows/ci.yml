name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        working-directory: backend
        # Pyright is intentionally not in requirements.txt (not a runtime
        # dependency of the Docker image); pin it here for reproducible CI.
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install pyright==1.1.408

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: Type check (pyright)
        working-directory: backend
        run: pyright app tests

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: securityscorecard-backend:ci

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit (moderate+)
        working-directory: frontend
        # Fails on moderate+ vulnerabilities; low-severity findings
        # (adapter-static false positives) are excluded by --audit-level.
        run: npm audit --audit-level=moderate

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: securityscorecard-frontend:ci
