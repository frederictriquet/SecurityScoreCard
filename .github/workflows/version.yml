name: Auto Version

on:
  push:
    branches: ["master"]

jobs:
  tag:
    name: Bump version & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version based on conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false        # pas de bump si aucun commit conventionnel reconnu
          release_branches: master
          tag_prefix: v
          # Mapping commits → bump
          # feat: → minor  (ex: v1.0.0 → v1.1.0)
          # fix:  → patch  (ex: v1.0.0 → v1.0.1)
          # feat!: ou BREAKING CHANGE → major (ex: v1.0.0 → v2.0.0)

      - name: Summary
        if: steps.tag.outputs.new_tag != ''
        run: |
          echo "### 🏷️ Nouveau tag créé" >> $GITHUB_STEP_SUMMARY
          echo "**${{ steps.tag.outputs.previous_tag }}** → **${{ steps.tag.outputs.new_tag }}**" >> $GITHUB_STEP_SUMMARY
          echo "Bump type : \`${{ steps.tag.outputs.release_type }}\`" >> $GITHUB_STEP_SUMMARY
