services:
  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-securityscorecard-backend:local}
    volumes:
      - db_data:/data
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-securityscorecard-frontend:local}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
